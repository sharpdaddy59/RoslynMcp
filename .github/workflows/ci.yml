name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Restore the fixture solutions here, in a clean shell, rather than from inside the
      # test process: a `dotnet restore` spawned by the tests inherits MSBuildLocator's
      # MSBuild variables, and an ImpactSolution restore failed that way on CI (2026-11-26).
      # One retry absorbs a nuget.org blip. The tests' own EnsureRestored then skips.
      - name: Restore test fixtures
        run: |
          for sln in fixtures/*/*.slnx; do
            dotnet restore "$sln" || { echo "retrying $sln"; sleep 15; dotnet restore "$sln"; }
          done

      # SharpCoderSolutionTests skip visibly here - they need the sibling SharpCoder
      # checkout and run locally.
      - name: Test
        run: dotnet test --no-build --configuration Release
