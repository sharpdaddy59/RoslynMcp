name: GitHub Release

on:
  push:
    tags:
      - 'v*' # v2.1.0 etc. - the tag is the release button

permissions:
  contents: write # create the release and attach the package

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # FixtureSolutionTests self-restore the in-repo fixture; the SharpCoder
      # integration tests skip here (no sibling checkout) exactly as in ci.yml.
      - name: Test
        run: dotnet test --configuration Release

      - name: Verify tag matches csproj version
        run: |
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/RoslynMcp/RoslynMcp.csproj)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CSPROJ_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match csproj version $CSPROJ_VERSION - refusing to release"
            exit 1
          fi

      - name: Pack the .NET tool
        run: dotnet pack src/RoslynMcp --configuration Release --output ./artifacts

      # The nupkg is a .NET global tool package; installing from a local folder needs
      # no feed: dotnet tool install -g RoslynMcp --add-source <folder with the nupkg>
      - name: Create GitHub Release with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
            --title "RoslynMcp $GITHUB_REF_NAME" \
            --generate-notes
