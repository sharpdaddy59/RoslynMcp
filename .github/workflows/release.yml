name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # v2.1.0 etc. - the tag is the publish button

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC token issuance for NuGet Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # FixtureSolutionTests self-restore the in-repo fixture; the SharpCoder
      # integration tests skip here (no sibling checkout) exactly as in ci.yml.
      - name: Test
        run: dotnet test --configuration Release

      - name: Verify tag matches csproj version
        run: |
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/RoslynMcp/RoslynMcp.csproj)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CSPROJ_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match csproj version $CSPROJ_VERSION - refusing to publish"
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/RoslynMcp --configuration Release --output ./artifacts

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # (1 hour) NuGet API key. No stored secrets - nuget.org validates this
      # workflow against the trusted publishing policy on the sharpdaddy account
      # (one policy per repository + workflow file).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: sharpdaddy

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
